<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复盘文档 · 渲染视图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F8F6F2;
            color: #2C2416;
            line-height: 1.6;
            min-height: 100vh;
            padding: 24px;
        }
        .toolbar {
            max-width: 880px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .back-link {
            color: #00A7CB;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .file-path {
            color: #999080;
            font-size: 0.78rem;
            font-family: monospace;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #fff;
            padding: 48px 56px;
            border-radius: 14px;
            border: 1px solid #E6DFD3;
            box-shadow: 0 2px 12px rgba(44,36,22,0.05);
            min-height: 60vh;
        }
        h1, h2, h3, h4, h5, h6 {
            color: #2C2416;
            margin-top: 1.6em;
            margin-bottom: 0.6em;
            line-height: 1.3;
        }
        h1 {
            font-size: 1.8rem;
            border-bottom: 2px solid #E6DFD3;
            padding-bottom: 12px;
            margin-top: 0;
        }
        h2 { font-size: 1.4rem; }
        h3 { font-size: 1.15rem; }
        p { margin-bottom: 0.8em; }
        code {
            background: #F5F2EC;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
        }
        pre {
            background: #2C2416;
            color: #F5F2EC;
            padding: 16px 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1em 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        pre code {
            background: none;
            padding: 0;
            color: inherit;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid #E6DFD3;
            padding: 8px 12px;
            text-align: left;
        }
        th { background: #F8F6F2; font-weight: 600; }
        blockquote {
            border-left: 3px solid #00A7CB;
            padding-left: 14px;
            margin: 1em 0;
            color: #6B5F4E;
        }
        ul, ol { padding-left: 1.5em; margin-bottom: 1em; }
        li { margin-bottom: 0.3em; }
        hr {
            border: none;
            border-top: 1px solid #E6DFD3;
            margin: 1.5em 0;
        }
        a {
            color: #00A7CB;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; }
        .loading {
            text-align: center;
            color: #999080;
            padding: 40px;
        }
        .error {
            background: #FEE;
            border: 1px solid #FAA;
            color: #C33;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <a href="./" class="back-link">← 返回对比总览</a>
        <span class="file-path" id="filePath"></span>
    </div>
    <div class="container" id="content">
        <div class="loading">加载中…</div>
    </div>

    <script>
        // 解析 URL 中的 ?path= 参数
        const params = new URLSearchParams(window.location.search);
        const path = params.get('path');

        if (!path) {
            document.getElementById('content').innerHTML = '<div class="error">未指定文件路径。请使用 ?path=XXX/复盘.md</div>';
        } else {
            document.getElementById('filePath').textContent = path;
            fetch(path)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(text => {
                    document.getElementById('content').innerHTML = marked.parse(text);
                })
                .catch(err => {
                    document.getElementById('content').innerHTML =
                        '<div class="error">加载失败: ' + err.message + '<br><br>文件路径: ' + path + '</div>';
                });
        }
    </script>
</body>
</html>
